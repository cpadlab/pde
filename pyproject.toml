[project]
name = "cp-pde"
version = "1.0.0"
description = "Pattern Discovery Engine: A unified library for pattern discovery, anomaly detection, and conformal calibration."
authors = [
    {name = "cpadlab", email = "cpadlab@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,!=3.14.1"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "hdbscan (>=0.8.44,<0.9.0)",
    "mlxtend (>=0.25.0,<0.26.0)",
    "networkx (>=3.7,<4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poetry]
packages = [{ include = "pde", from = "src" }]

[tool.pytest.ini_options]
minversion = "9.2.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=pde --cov-report=term-missing"

[tool.coverage.run]
source = ["src/pde"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90